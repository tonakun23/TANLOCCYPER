# Render Blueprint cho Tấn Online — bản web chơi với bot (static site).
# Sau khi kết nối Render, Render sẽ đọc file này từ repo tonakun23/TANLOCCYPER, nhánh main.
# Chưa có server online thật (Colyseus/NestJS) nên chưa deploy backend ở đây.
services:
  - type: web
    name: tanloccyper-web
    env: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
