# Render Blueprint cho Tấn Online.
# - tanloccyper-web: bản web chơi với bot (static site).
# - tanloccyper-api: backend tối thiểu (REST, server-authoritative, luật VN-8,
#   phòng trong RAM, chưa có Postgres/Redis/JWT/WebSocket — xem apps/game-server/server.js).
services:
  - type: web
    name: tanloccyper-web
    env: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: tanloccyper-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm --prefix apps/game-server install
    startCommand: node apps/game-server/server.js
    healthCheckPath: /health
